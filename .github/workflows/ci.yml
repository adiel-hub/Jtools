name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python }} --all-groups
      - name: Lint
        run: uv run ruff check src tests bench scripts
      - name: Format
        run: uv run ruff format --check src tests bench scripts
      - name: Types
        run: uv run mypy src
      - name: Offline tests (no key; MockJev speaks both wire formats)
        run: uv run pytest -q -m "not live" --timeout 180
      - name: Docs match the recorded benchmark results
        if: matrix.python == '3.13'
        run: uv run python scripts/update_docs.py --check
      - name: Shell completions match the parsers
        if: matrix.python == '3.13'
        run: uv run python scripts/gen_completions.py --check

  package:
    name: the wheel alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Every command runs from an empty virtualenv, with no key and no network
        run: uv run --no-project python scripts/check_wheel.py

  live:
    name: live smoke (needs a key)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      # A fork, or a repository whose owner has not added a key, has no secret to run these with.
      # pytest exits 5 when a marker selects nothing, which would fail the job for no reason, so
      # the step is skipped outright and says so. (The secrets context is not available to a
      # job-level `if`, which is why this is a step rather than a condition on the job.)
      - name: Is an API key configured?
        id: key
        run: |
          if [ -n "${TYPESAFE_API_KEY}${OPENROUTER_API_KEY}${AI_GATEWAY_API_KEY}" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No API key secret is set, so the live smoke tests did not run."
          fi
      - name: One real call per tool
        if: steps.key.outputs.present == 'yes'
        run: uv run pytest -q -m live --timeout 300 -s
