<svg xmlns='http://www.w3.org/2000/svg' width='760' height='260' viewBox='0 0 760 260' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='760' height='260' fill='white' rx='8'/>
<text x='20' y='30' font-size='18' font-weight='600' fill='#24292f'>One decision in 238 ms, 16 about the same line in 260 ms</text>
<text x='20' y='52' font-size='12' fill='#57606a'>j-tools puts every question about a line into one request, so asking more of them costs tokens rather than time.</text>
<text x='20' y='68' font-size='12' fill='#57606a'>60 sequential calls, uncached, on 2026-09-19.</text>
<text x='268' y='104' font-size='13' fill='#24292f' text-anchor='end'>one yes/no question, median</text>
<rect x='278' y='90' width='227.9' height='20' rx='3' fill='#2da44e'/>
<text x='513.9' y='105' font-size='12' fill='#24292f'>238 ms</text>
<text x='268' y='138' font-size='13' fill='#24292f' text-anchor='end'>one yes/no question, 95th percentile</text>
<rect x='278' y='124' width='362.0' height='20' rx='3' fill='#bf8700'/>
<text x='648.0' y='139' font-size='12' fill='#24292f'>378 ms</text>
<text x='268' y='172' font-size='13' fill='#24292f' text-anchor='end'>4 questions about one line, median</text>
<rect x='278' y='158' width='238.5' height='20' rx='3' fill='#0969da'/>
<text x='524.5' y='173' font-size='12' fill='#24292f'>249 ms</text>
<text x='268' y='206' font-size='13' fill='#24292f' text-anchor='end'>16 questions about one line, median</text>
<rect x='278' y='192' width='249.0' height='20' rx='3' fill='#0969da'/>
<text x='535.0' y='207' font-size='12' fill='#24292f'>260 ms</text>
<text x='740' y='246' font-size='11' fill='#57606a' text-anchor='end'>milliseconds for the HTTP exchange, network included</text>
</svg>
