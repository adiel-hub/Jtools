<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#24292f">Inside every tool: stream in, judge concurrently, deliver in order, never buffer a live pipe.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-size="12" fill="#24292f" text-anchor="middle">
    <rect x="24" y="60" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="84" y="84">stdin / files</text>
    <text x="84" y="102" fill="#57606a" font-size="11">readline, no read-ahead</text>

    <line x1="144" y1="88" x2="184" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="186" y="60" width="130" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="251" y="84">bounded queue</text>
    <text x="251" y="102" fill="#57606a" font-size="11">backpressure = -j</text>

    <line x1="316" y1="88" x2="356" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="358" y="48" width="170" height="80" rx="8" fill="#eef6ff" stroke="#0969da"/>
    <text x="443" y="72" font-weight="600" fill="#0969da">Jev client</text>
    <text x="443" y="90" fill="#57606a" font-size="11">batch · cache · share in-flight</text>
    <text x="443" y="106" fill="#57606a" font-size="11">retry in a deadline · brake on 429</text>
    <text x="443" y="122" fill="#57606a" font-size="11">meter tokens and dollars</text>

    <line x1="528" y1="88" x2="568" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="570" y="60" width="130" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="635" y="84">ordered delivery</text>
    <text x="635" y="102" fill="#57606a" font-size="11">input order restored</text>

    <line x1="700" y1="88" x2="740" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="742" y="60" width="114" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="799" y="84">stdout</text>
    <text x="799" y="102" fill="#57606a" font-size="11">flushed per line</text>
  </g>
  <text x="24" y="152" font-size="12" fill="#57606a">Fail open: an unjudged line passes through and the exit status is 5. A gate fails closed. Errors are reported once a minute, not once a line.</text>
</svg>
