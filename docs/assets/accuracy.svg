<text x='648.0' y='105' font-size='12' fill='#24292f'>1.00</text>
<text x='316' y='138' font-size='13' fill='#24292f' text-anchor='end'>a 17-term keyword regex, F1</text>
<rect x='326' y='124' width='89.7' height='20' rx='3' fill='#cf222e'/>
<text x='423.7' y='139' font-size='12' fill='#24292f'>0.29</text>
<text x='316' y='172' font-size='13' fill='#24292f' text-anchor='end'>jsort ranks review sentiment, AUC (n=20)</text>
<rect x='326' y='158' width='237.9' height='20' rx='3' fill='#2da44e'/>
<text x='571.9' y='173' font-size='12' fill='#24292f'>0.76</text>
<text x='316' y='206' font-size='13' fill='#24292f' text-anchor='end'>the same, precision in the top half</text>
<rect x='326' y='192' width='314.0' height='20' rx='3' fill='#0969da'/>
<text x='648.0' y='207' font-size='12' fill='#24292f'>1.00</text>
<text x='316' y='240' font-size='13' fill='#24292f' text-anchor='end'>jtag labels AG News 4 ways, accuracy (n=20)</text>
<rect x='326' y='226' width='157.0' height='20' rx='3' fill='#2da44e'/>
<text x='491.0' y='241' font-size='12' fill='#24292f'>0.50</text>
<text x='316' y='274' font-size='13' fill='#24292f' text-anchor='end'>the same, macro F1</text>
<rect x='326' y='260' width='186.0' height='20' rx='3' fill='#0969da'/>
<text x='520.0' y='275' font-size='12' fill='#24292f'>0.59</text>
<text x='740' y='314' font-size='11' fill='#57606a' text-anchor='end'>0 to 1; higher is better</text>
