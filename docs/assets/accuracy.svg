<svg xmlns='http://www.w3.org/2000/svg' width='760' height='260' viewBox='0 0 760 260' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='760' height='260' fill='white' rx='8'/>
<text x='20' y='30' font-size='18' font-weight='600' fill='#24292f'>Tell it what you want in one sentence. It gets the rest right.</text>
<text x='20' y='52' font-size='12' fill='#57606a'>No examples, no training, no tuning — each row is the real command run over a whole public dataset, given</text>
<text x='20' y='68' font-size='12' fill='#57606a'>nothing but a one-line description of what to look for.</text>
<text x='309' y='104' font-size='13' fill='#24292f' text-anchor='end'>find the spam in 5,574 text messages</text>
<rect x='319' y='90' width='294.3' height='20' rx='3' fill='#2da44e'/>
<text x='621.3' y='105' font-size='12' fill='#24292f'>0.91</text>
<text x='309' y='138' font-size='13' fill='#24292f' text-anchor='end'>a 17-word keyword filter, same messages</text>
<rect x='319' y='124' width='231.3' height='20' rx='3' fill='#cf222e'/>
<text x='558.3' y='139' font-size='12' fill='#24292f'>0.72</text>
<text x='309' y='172' font-size='13' fill='#24292f' text-anchor='end'>put 3,000 reviews in order, happiest first</text>
<rect x='319' y='158' width='321.0' height='20' rx='3' fill='#2da44e'/>
<text x='648.0' y='173' font-size='12' fill='#24292f'>1.00</text>
<text x='309' y='206' font-size='13' fill='#24292f' text-anchor='end'>sort 7,600 news stories into 4 topics</text>
<rect x='319' y='192' width='279.0' height='20' rx='3' fill='#2da44e'/>
<text x='606.0' y='207' font-size='12' fill='#24292f'>0.87</text>
<text x='740' y='246' font-size='11' fill='#57606a' text-anchor='end'>1.00 is perfect: F1 for the spam rows, ranking quality for the reviews, share labelled correctly for the news</text>
</svg>
