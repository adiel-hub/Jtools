<svg xmlns='http://www.w3.org/2000/svg' width='760' height='294' viewBox='0 0 760 294' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='760' height='294' fill='white' rx='8'/>
<text x='20' y='30' font-size='18' font-weight='600' fill='#24292f'>120 lines judged per second</text>
<text x='20' y='52' font-size='12' fill='#57606a'>One flag. The same file through the real jgrep, uncached: -j raises how many decisions are in flight at once,</text>
<text x='20' y='68' font-size='12' fill='#57606a'>and 600 lines go from 150 s to 5 s.</text>
<text x='250' y='104' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 1</text>
<rect x='260' y='90' width='12.6' height='20' rx='3' fill='#0969da'/>
<text x='280.6' y='105' font-size='12' fill='#24292f'>4 lines/s</text>
<text x='250' y='138' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 8</text>
<rect x='260' y='124' width='86.8' height='20' rx='3' fill='#2da44e'/>
<text x='354.8' y='139' font-size='12' fill='#24292f'>27 lines/s</text>
<text x='250' y='172' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 16</text>
<rect x='260' y='158' width='163.8' height='20' rx='3' fill='#2da44e'/>
<text x='431.8' y='173' font-size='12' fill='#24292f'>52 lines/s</text>
<text x='250' y='206' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 32</text>
<rect x='260' y='192' width='283.6' height='20' rx='3' fill='#2da44e'/>
<text x='551.6' y='207' font-size='12' fill='#24292f'>90 lines/s</text>
<text x='250' y='240' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 48</text>
<rect x='260' y='226' width='380.0' height='20' rx='3' fill='#2da44e'/>
<text x='648.0' y='241' font-size='12' fill='#24292f'>120 lines/s</text>
<text x='740' y='280' font-size='11' fill='#57606a' text-anchor='end'>lines per second</text>
</svg>
