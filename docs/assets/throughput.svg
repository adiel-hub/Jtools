<svg xmlns='http://www.w3.org/2000/svg' width='760' height='210' viewBox='0 0 760 210' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='760' height='210' fill='white' rx='8'/>
<text x='20' y='30' font-size='18' font-weight='600' fill='#24292f'>Throughput: lines judged per second</text>
<text x='20' y='52' font-size='12' fill='#57606a'>the same file through the real jgrep, uncached</text>
<text x='250' y='88' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 1</text>
<rect x='260' y='74' width='10.6' height='20' rx='3' fill='#0969da'/>
<text x='278.6' y='89' font-size='12' fill='#24292f'>4 lines/s  (148s for 600)</text>
<text x='250' y='122' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 8</text>
<rect x='260' y='108' width='82.4' height='20' rx='3' fill='#2da44e'/>
<text x='350.4' y='123' font-size='12' fill='#24292f'>32 lines/s  (19s for 600)</text>
<text x='250' y='156' font-size='13' fill='#24292f' text-anchor='end'>jgrep -j 32</text>
<rect x='260' y='142' width='301.0' height='20' rx='3' fill='#2da44e'/>
<text x='569.0' y='157' font-size='12' fill='#24292f'>115 lines/s  (5s for 600)</text>
<text x='740' y='196' font-size='11' fill='#57606a' text-anchor='end'>lines per second</text>
</svg>
